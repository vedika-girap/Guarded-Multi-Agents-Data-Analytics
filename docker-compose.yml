services:
  redis:
    image: redis:7-alpine
    profiles: ["shared-limits"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      # >>> ACTION REQUIRED (Stage 2): Set a local PostgreSQL admin password in .env.
      # See example for the values in .env.example
      # See README section "PostgreSQL local testing".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # >>> ACTION REQUIRED (Stage 2): Set a distinct read-only app-role password in .env.
      # See README section "PostgreSQL local testing".
      
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
      - ./postgres/01-create-app-role.sql:/docker-entrypoint-initdb.d/01-create-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  postgres_data:
